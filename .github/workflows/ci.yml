name: CI

on:
  push:
    branches:
      - main
      - 'refactor/**'
      - 'backup/**'
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build docs
        run: npm run build

      - name: SEO audit
        run: npm run audit:seo

      - name: Build guard
        run: npm run audit:build

      - name: Run smoke tests
        run: npm run test:smoke

      - name: Capture visual baseline
        run: npm run test:visual

      - name: Upload docs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-build
          path: docs

      - name: Upload visual baseline screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baseline-screenshots
          path: audit/pass0-baseline/screenshots
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
