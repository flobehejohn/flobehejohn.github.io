name: CI

on:
  push:
    branches:
      - main
      - 'refactor/**'
      - 'backup/**'
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build docs
        run: npm run build
      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-build
          path: docs
          include-hidden-files: true

  seo:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs
      - name: SEO audit
        run: npm run audit:seo

  analytics:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs
      - name: Analytics audit
        run: npm run audit:analytics

  content:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs
      - name: Deep content inventory audit
        run: npm run audit:content

  build_guard:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs
      - name: Build guard
        run: npm run audit:build

  smoke:
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
      - build
      - seo
      - analytics
      - content
      - build_guard
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run smoke tests
        run: npm run test:smoke
      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  runtime:
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run runtime JS contracts
        run: npm run test:runtime
      - name: Upload runtime report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-runtime
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  deep:
    runs-on: ubuntu-latest
    needs: runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run deep portfolio certification
        run: npx playwright test tests/portfolio-deep-runtime.spec.ts
      - name: Upload deep runtime report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-deep-runtime
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  visual:
    runs-on: ubuntu-latest
    needs: deep
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Capture visual baseline
        run: npm run test:visual
      - name: Upload visual baseline screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baseline-screenshots
          path: audit/pass0-baseline/screenshots
          if-no-files-found: ignore
      - name: Upload visual report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-visual
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
