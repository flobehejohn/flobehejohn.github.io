name: CI

on:
  push:
    branches:
      - main
      - 'refactor/**'
      - 'backup/**'
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: docs-build
          path: docs
          include-hidden-files: true

  seo:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs
      - run: npm run audit:seo

  analytics:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs
      - run: npm run audit:analytics

  content:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs
      - run: npm run audit:content

  build_guard:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs
      - run: npm run audit:build

  smoke:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build, seo, analytics, content, build_guard]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  runtime:
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:runtime
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-runtime
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  deep:
    runs-on: ubuntu-latest
    needs: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/portfolio-deep-runtime.spec.ts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-deep-runtime
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  particles_runtime:
    runs-on: ubuntu-latest
    needs: deep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:particles-runtime
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-particles-runtime
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  audio_runtime:
    runs-on: ubuntu-latest
    needs: deep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:audio-runtime
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-audio-runtime
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  dynamic_text_runtime:
    runs-on: ubuntu-latest
    needs: deep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:dynamic-text
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-dynamic-text-runtime
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  ga4_runtime:
    runs-on: ubuntu-latest
    needs: deep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ga4-runtime
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-ga4-runtime
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  rich_runtime:
    runs-on: ubuntu-latest
    needs: [particles_runtime, audio_runtime, dynamic_text_runtime, ga4_runtime]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:rich-runtime
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-rich-runtime
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  visual:
    runs-on: ubuntu-latest
    needs: rich_runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baseline-screenshots
          path: audit/pass0-baseline/screenshots
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-visual
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
