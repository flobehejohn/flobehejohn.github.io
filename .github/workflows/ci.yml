name: CI

on:
  push:
    branches:
      - main
      - 'refactor/**'
      - 'fix/**'
      - 'backup/**'
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: docs-build
          path: docs
          include-hidden-files: true

  seo:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs
      - run: npm run audit:seo

  analytics:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs
      - run: npm run audit:analytics

  content:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs
      - run: npm run audit:content

  build_guard:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs
      - run: npm run audit:build

  security:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs
      - run: npm run audit:security
      - run: npm run test:security
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-security
          path: audit/_latest
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-security
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  smoke:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build, seo, analytics, content, build_guard, security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  runtime:
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:runtime
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-runtime
          path: |
            playwright-report
            test-results
            audit/_latest
          if-no-files-found: ignore

  deep:
    runs-on: ubuntu-latest
    needs: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/portfolio-deep-runtime.spec.ts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-deep-runtime
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  particles_runtime:
    runs-on: ubuntu-latest
    needs: deep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:particles-runtime
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-particles-runtime
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  audio_runtime:
    runs-on: ubuntu-latest
    needs: deep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:audio-runtime
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-audio-runtime
          path: audit/_latest
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-audio-runtime
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  audio_r2_runtime:
    runs-on: ubuntu-latest
    needs: audio_runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:audio-r2-runtime
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-audio-r2-runtime
          path: audit/_latest
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-audio-r2-runtime
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  dynamic_text_runtime:
    runs-on: ubuntu-latest
    needs: deep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:dynamic-text
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-dynamic-text-runtime
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  ga4_runtime:
    runs-on: ubuntu-latest
    needs: deep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ga4-runtime
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-ga4-runtime
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  rich_runtime:
    runs-on: ubuntu-latest
    needs: [particles_runtime, audio_r2_runtime, dynamic_text_runtime, ga4_runtime]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:rich-runtime
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-rich-runtime
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  pjax_runtime:
    runs-on: ubuntu-latest
    needs: rich_runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pjax-runtime
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-pjax-runtime
          path: audit/_latest
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-pjax-runtime
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  interactive_runtime:
    runs-on: ubuntu-latest
    needs: pjax_runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:interactive-runtime
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-interactive-runtime
          path: audit/_latest
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-interactive-runtime
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  site_matrix:
    runs-on: ubuntu-latest
    needs: interactive_runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:site-matrix
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-site-matrix
          path: audit/_latest
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-site-matrix
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  visual:
    runs-on: ubuntu-latest
    needs: site_matrix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
      - name: Write visual proof summary
        run: |
          mkdir -p audit/_latest
          node -e "const fs=require('fs'); fs.writeFileSync('audit/_latest/visual-summary.json', JSON.stringify({timestamp:new Date().toISOString(), verdict:'passed', source:'npm run test:visual'}, null, 2) + '\n')"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-visual
          path: audit/_latest
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baseline-screenshots
          path: audit/pass0-baseline/screenshots
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-visual
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  rawgithack_preview:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:rawgithack-preview
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-rawgithack-preview
          path: audit/_latest
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-rawgithack-preview
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  release_manifest:
    runs-on: ubuntu-latest
    needs: [visual, rawgithack_preview]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs
      - name: Download audit proof artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: audit-*
          path: audit/_latest
          merge-multiple: true
      - run: npm run audit:release
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: audit/_latest/release-manifest.json
          if-no-files-found: error
