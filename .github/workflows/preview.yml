name: Preview

on:
  workflow_dispatch:
  push:
    branches:
      - 'refactor/validate-unblock-20260423'
      - 'fix/legacy-interactions-audio-pjax-certification-20260425'

concurrency:
  group: preview-refactor-live
  cancel-in-progress: true

permissions:
  contents: write
  actions: read
  pull-requests: read

env:
  PREVIEW_BRANCH: preview/refactor-live

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build docs
        run: npm run build

      - name: SEO audit
        run: npm run audit:seo

      - name: Build guard
        run: npm run audit:build

      - name: Analytics audit
        run: npm run audit:analytics

      - name: Deep content inventory audit
        run: npm run audit:content

      - name: Security audit
        run: npm run audit:security

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run test:smoke

      - name: Run runtime JS contracts
        run: npm run test:runtime

      - name: Run deep portfolio certification
        run: npx playwright test tests/portfolio-deep-runtime.spec.ts

      - name: Run particles runtime certification
        run: npm run test:particles-runtime

      - name: Run audio runtime certification
        run: npm run test:audio-runtime

      - name: Run audio R2 certification
        run: npm run test:audio-r2-runtime

      - name: Run dynamic text runtime certification
        run: npm run test:dynamic-text

      - name: Run GA4 runtime certification
        run: npm run test:ga4-runtime

      - name: Run rich legacy runtime certification
        run: npm run test:rich-runtime

      - name: Run PJAX certification
        run: npm run test:pjax-runtime

      - name: Run interactive modules certification
        run: npm run test:interactive-runtime

      - name: Run site matrix certification
        run: npm run test:site-matrix

      - name: Run security runtime certification
        run: npm run test:security

      - name: Capture visual baseline
        run: npm run test:visual

      - name: Write visual proof summary
        run: |
          mkdir -p audit/_latest
          node -e "const fs=require('fs'); fs.writeFileSync('audit/_latest/visual-summary.json', JSON.stringify({timestamp:new Date().toISOString(), verdict:'passed', source:'npm run test:visual'}, null, 2) + '\n')"

      - name: Run RawGitHack preview certification
        run: npm run test:rawgithack-preview

      - name: Generate release proof manifest
        run: npm run audit:release

      - name: Build preview bundle
        run: node scripts/build-preview.mjs

      - name: Publish preview branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_branch: ${{ env.PREVIEW_BRANCH }}
          publish_dir: ./preview-dist
          force_orphan: true
          commit_message: "deploy(preview): publish certified legacy runtime preview ${{ github.sha }}"

      - name: Verify preview branch references certified head
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail

          for i in $(seq 1 12); do
            message="$(gh api "/repos/${{ github.repository }}/commits/preview/refactor-live" --jq '.commit.message')"
            echo "preview/refactor-live message: $message"

            if echo "$message" | grep -F "$EXPECTED_HEAD"; then
              echo "[OK] preview/refactor-live references $EXPECTED_HEAD"
              exit 0
            fi

            echo "[WAIT] preview branch not updated yet, retry $i/12"
            sleep 5
          done

          echo "[FAIL] preview/refactor-live does not reference $EXPECTED_HEAD"
          exit 1

      - name: Upload preview artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-dist
          path: preview-dist
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-playwright-report
          path: |
            playwright-report
            test-results
            audit/_latest
          if-no-files-found: ignore

      - name: Upload visual baseline screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-visual-baseline-screenshots
          path: audit/pass0-baseline/screenshots
          if-no-files-found: ignore
