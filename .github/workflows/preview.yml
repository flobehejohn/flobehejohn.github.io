name: Preview

on:
  workflow_dispatch:
  push:
    branches:
      - 'refactor/validate-unblock-20260423'

permissions:
  contents: write

env:
  PREVIEW_BRANCH: preview/refactor-live

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build docs
        run: npm run build

      - name: SEO audit
        run: npm run audit:seo

      - name: Build guard
        run: npm run audit:build

      - name: Analytics audit
        run: npm run audit:analytics

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run test:smoke

      - name: Capture visual baseline
        run: npm run test:visual

      - name: Build preview bundle
        run: node scripts/build-preview.mjs

      - name: Publish preview branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: ${{ env.PREVIEW_BRANCH }}
          publish_dir: ./preview-dist
          force_orphan: true
          commit_message: "deploy(preview): publish refactor preview"

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-dist
          path: preview-dist
          include-hidden-files: true

      - name: Upload visual baseline screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-visual-baseline-screenshots
          path: audit/pass0-baseline/screenshots
          if-no-files-found: ignore
